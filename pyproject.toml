[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iplotDataAccess"
description = "Data access for applications using IDSs or CBS"
authors = [{ name = "Lana Abadie", email = "lana.abadie@iter.org" }]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">= 3.8"
license = { text = "MIT" }
keywords = ["IDS", "CBS", "Interface Data Structures", "Control Breakdown Structure"]
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cachetools >= 4.2.0",
    "iplotLogging >= 0.2.1",
    "requests >= 2.25.1",
    "sseclient-py >= 1.7",
]
dynamic = ["version"]

[project.optional-dependencies]
imaspy = "PyYAML"

[project.urls]
Homepage = "https://git.iter.org/scm/vis/data-access.git"

[tool.setuptools]
packages = ["iplotDataAccess"]
package-dir = { "" = "." }

[tool.setuptools.package-data]
"iplotDataAccess" = ["data_sources.cfg"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "iplotDataAccess/_version.py"
versionfile_build = "iplotDataAccess/_version.py"
tag_prefix = ""
parentdir_prefix = ""




